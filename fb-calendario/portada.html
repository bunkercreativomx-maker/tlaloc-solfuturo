<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolFuturo · Calendario 30 días Facebook</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--accent:#8cc63f;--blue:#0099ff;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px 60px}
  .wrap{max-width:1240px;margin:0 auto}
  header{text-align:center;margin-bottom:22px}
  header h1{font-size:1.7rem;color:#fff;margin-bottom:6px}
  header p{color:var(--muted);font-size:.95rem}
  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0}
  .filters button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:7px 14px;cursor:pointer;font-size:.85rem}
  .filters button.active{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700}
  .download-bar{text-align:center;margin:14px 0 26px}
  #zipBtn{background:var(--accent);color:#0f172a;font-weight:700;font-size:1.05rem;padding:14px 30px;border:none;border-radius:10px;cursor:pointer}
  #zipBtn:disabled{opacity:.6;cursor:not-allowed}
  #zipStatus{margin-top:10px;color:var(--muted);font-size:.9rem;min-height:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card img{width:100%;height:auto;display:block}
  .card-body{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card-tag{font-size:.78rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .card-title{font-size:1rem;font-weight:700;color:#fff;line-height:1.3}
  .card-copy{font-size:.85rem;color:var(--text);line-height:1.5;white-space:pre-wrap;background:#0b1120;border:1px solid var(--border);border-radius:8px;padding:10px}
  .card-actions{display:flex;gap:8px;margin-top:auto}
  .card-actions button,.card-actions a{flex:1;text-align:center;background:#334155;color:#fff;text-decoration:none;padding:9px;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer}
  .card-actions a:hover,.card-actions button:hover{background:#475569}
  .card-actions .copy{background:var(--blue);color:#fff}
  .card-actions .copy:hover{background:#0a84d8}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:34px}
</style>
</head>

{d:17,aud:"residencial",pil:"Lifestyle",title:"Paneles = más valor a tu casa",copy:"Los paneles solares no solo bajan tu recibo: también suben el valor de tu casa 🏡.\n\nLas propiedades con solar se venden hasta 20% más rápido y a mejor precio. Es una mejora que se paga sola y le gana a la inflación de CFE.\n\n📞 Descubre tu cotización: 656 695 3960."},

{d:19,aud:"comercial",pil:"Educación",title:"Deducción fiscal explicada",copy:"Dueño de negocio 📊 ¿Sabías que puedes deducir el 100% de tu inversión solar en el primer año fiscal?\n\nCombinado con el ahorro en tu recibo y el financiamiento sin intereses, el ROI de un sistema comercial es de los más limpios que existen para una empresa.\n\n📞 Habla con un asesor y mira tus números: 656 695 3960."},
{d:20,aud:"ambos",pil:"Engagement",title:"Conoce a alguien que pague mucho",copy:"¿Conoces a alguien en Juárez que pague un recibo de luz altísimo? 🔥 Compártele este post.\n\nTal vez sea un familiar, un vecino o un colega con negocio. Un mensaje tuyo puede ahorrarle miles de pesos al año.\n\nEtiquétalos abajo 👇 y hagámosles la cotización gratis."},
{d:21,aud:"ambos",pil:"Conversión",title:"Cotiza con tu recibo en 24 hrs",copy:"¿Quieres saber cuánto ahorrarías con paneles solares? ☀️ No tienes que adivinar.\n\nEnvíanos tu recibo de CFE y en menos de 24 horas te mandamos una cotización personalizada, con tu ahorro estimado y opciones de financiamiento. Gratis y sin compromiso.\n\n📲 WhatsApp: 656 695 3960 · o directo en tlalocsolfuturo.com"},
{d:22,aud:"residencial",pil:"Educación",title:"Mito: si no hay sol, no hay luz",copy:"\"¿Y si está nublado? ¿Me quedo sin luz?\" 🤔 Mito.\n\nUn sistema conectado a la red funciona con el medidor bidireccional: cuando generas de más, se va a CFE; cuando generas de menos (o de noche), la red te respalda. Nunca te quedas a oscuras.\n\n📲 Te lo explicamos con calma: 656 695 3960."},
{d:23,aud:"residencial",pil:"Servicios",title:"Mantenimiento de paneles",copy:"¿Ya tienes paneles pero no les das mantenimiento? 🌧️ El polvo y el clima de Juárez reducen su eficiencia.\n\nSolFuturo no solo instala: revisamos electricidad, limpiamos, ajustamos cableado y dejamos tu sistema generando al máximo. Mantenimiento preventivo para que tu ahorro no baje.\n\n📞 Agenda tu revisión: 656 695 3960."},

{d:28,aud:"comercial",pil:"Confianza",title:"De casas a maquiladoras de 2 MW",copy:"De casas en Zona Dorada ($6,500/mes de ahorro) a plantas en Parque Industrial ($18,000/mes) 🏭 Instalamos desde sistemas residenciales hasta maquiladoras de 2 MW.\n\nTu proyecto, grande o chico, empieza igual: con tu recibo y una llamada.\n📞 656 695 3960."},
{d:29,aud:"ambos",pil:"Engagement",title:"¿Cuál es tu mayor duda?",copy:"Cierre de mes 💬 ¿Cuál es tu mayor duda sobre paneles solares? Precio, financiamiento, instalación, lo que sea.\n\nDéjanos tu pregunta en comentarios y la respondemos directo, aquí, sin rodeos. 👇"},
{d:30,aud:"ambos",pil:"Conversión",title:"El sol no falta en Juárez",copy:"En resumen ☀️: en Juárez el sol sobra, y con SolFuturo puedes reducir hasta 95% tu recibo sin pagar de contado.\n\nFinanciamiento sin intereses · deducción del 100% para negocios · +500 instalaciones · soporte local. Todo empieza con tu recibo.\n\n📲 Cotiza gratis hoy: 656 695 3960 · tlalocsolfuturo.com"}

const slug = t => t.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
let currentFilter = 'all';

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DAYS.filter(x => currentFilter==='all' || x.aud===currentFilter).forEach(x=>{
    const fn = 'day'+String(x.d).padStart(2,'0')+'.png';
    const dl = String(x.d).padStart(2,'0')+'_DIA-'+String(x.d).padStart(2,'0')+'_'+slug(x.title)+'.png';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<img src="'+IMG_BASE+fn+'" alt="Día '+x.d+'" loading="lazy">' +
      '<div class="card-body">' +
        '<div class="card-tag">Día '+x.d+' · '+x.pil+' · '+({residencial:'🏠',comercial:'🏪',ambos:'🔄'})[x.aud]+'</div>' +
        '<div class="card-title">'+x.title+'</div>' +
        '<div class="card-copy">'+x.copy.replace(/\n/g,'<br>')+'</div>' +
        '<div class="card-actions">' +
          '<button class="copy" data-copy="'+x.d+'">📋 Copiar copy</button>' +
          '<a href="'+IMG_BASE+fn+'" download="'+dl+'">⬇️ Imagen</a>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });
  document.querySelectorAll('button.copy').forEach(b=>{
    b.addEventListener('click', ()=>{
      const d = DAYS.find(y=>y.d==b.dataset.copy);
      navigator.clipboard.writeText(d.copy).then(()=>{
        b.textContent='✅ Copiado'; setTimeout(()=>b.textContent='📋 Copiar copy',1600);
      });
    });
  });
}

document.getElementById('filters').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  currentFilter = e.target.dataset.f;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active', b===e.target));
  render();
});

async function downloadAll(){
  const btn = document.getElementById('zipBtn');
  const st = document.getElementById('zipStatus');
  btn.disabled = true;
  st.textContent = 'Empacando ZIP (30 imágenes)…';
  try{
    const zip = new JSZip();
    for(const x of DAYS){
      const fn = 'day'+String(x.d).padStart(2,'0')+'.png';
      const dl = String(x.d).padStart(2,'0')+'_DIA-'+String(x.d).padStart(2,'0')+'_'+slug(x.title)+'.png';
      const resp = await fetch(IMG_BASE + fn);
      if(!resp.ok) throw new Error('No se pudo leer '+fn);
      zip.file(dl, await resp.blob());
    }
    const content = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(content);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'solfuturo_calendario_30_dias.zip';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    st.textContent = '✅ ZIP descargado.';
  }catch(e){
    st.textContent = '❌ Error: '+e.message;
  }finally{
    btn.disabled = false;
  }
}

render();
</script>
</body>
</html>
